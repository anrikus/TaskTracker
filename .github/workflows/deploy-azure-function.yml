name: Deploy TaskTracker Azure Function

on:
  push:
    branches: [ main ]
    paths: 
      - 'azure_function/**'
      - 'task_tracker/**'
      - 'pyproject.toml'
      - '.github/workflows/deploy-azure-function.yml'
  pull_request:
    branches: [ main ]
    paths: 
      - 'azure_function/**'
      - 'task_tracker/**'
      - 'pyproject.toml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: tasktracker-func-prod
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './azure_function'
  PYTHON_VERSION: '3.11'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }} Environment
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r azure_function/requirements.txt
        pip install -e .
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        # Add your test commands here
        python -m pytest tests/ --cov=task_tracker --cov-report=xml || echo "No tests found"

    - name: Lint code
      run: |
        pip install black isort flake8
        black --check azure_function/ task_tracker/ || echo "Code formatting issues found"
        isort --check-only azure_function/ task_tracker/ || echo "Import sorting issues found"
        flake8 azure_function/ task_tracker/ || echo "Linting issues found"

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }} Environment
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r azure_function/requirements.txt
        pip install -e .

    - name: 'Login to Azure'
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 'Run Azure Functions Action'
      uses: Azure/functions-action@v1
      id: fa
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

    - name: 'Test deployed function'
      run: |
        # Wait for deployment to complete
        sleep 30
        
        # Test health endpoint
        curl -f "https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/health" || exit 1
        
        # Test models endpoint
        curl -f "https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/models" || exit 1
        
        echo "Deployment test successful!"

  deploy-infrastructure:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: 'Login to Azure'
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 'Deploy ARM Template'
      uses: azure/arm-deploy@v1
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        resourceGroupName: ${{ secrets.AZURE_RG }}
        template: ./deployment/arm-templates/azuredeploy.json
        parameters: ./deployment/arm-templates/azuredeploy.parameters.json
